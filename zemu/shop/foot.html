<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>متجر الأزياء الرياضية</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 40px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .product {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 230px;
      text-align: center;
      padding: 15px;
      transition: transform 0.3s ease;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 17px;
      color: #333;
      margin-bottom: 12px;
    }

    .buy-btn {
      display: inline-block;
      background-color: #1abc9c;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .buy-btn:hover {
      background-color: #16a085;
    }
  </style>
</head>
<body>

  <h1>الأزياء الرياضية</h1>

  <div class="products">

    </div>

    <div class="product">
      <img src="https://i.postimg.cc/C1VMNtC5/pngtree-football-boots-tournament-leather-futbol-photo-image-19759982.jpg" alt="حذاء رياضي 2">
      <div class="price">السعر: ٩٠٠ جنيه</div>

  </div>

</body>
