<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>مستلزمات التعليم</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f2f6ff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 40px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .product {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 230px;
      text-align: center;
      padding: 15px;
      transition: transform 0.3s ease;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 17px;
      color: #34495e;
      margin-bottom: 12px;
    }

    .buy-btn {
      display: inline-block;
      background-color: #2d98da;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .buy-btn:hover {
      background-color: #1e6bb8;
    }
  </style>
</head>
